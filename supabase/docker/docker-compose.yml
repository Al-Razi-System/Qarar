name: supabase
services:
  analytics:
    container_name: qarar-supabase-analytics
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      DB_DATABASE: _supabase
      DB_HOSTNAME: ${POSTGRES_HOST}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${POSTGRES_PORT}
      DB_SCHEMA: _analytics
      DB_USERNAME: supabase_admin
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true
      LOGFLARE_NODE_HOST: 127.0.0.1
      LOGFLARE_PRIVATE_ACCESS_TOKEN: ${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
      LOGFLARE_SINGLE_TENANT: "true"
      LOGFLARE_SUPABASE_MODE: "true"
      POSTGRES_BACKEND_SCHEMA: _analytics
      POSTGRES_BACKEND_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -sSfL -o /dev/null http://localhost:4000/health
      timeout: 5s
    image: public.ecr.aws/supabase/logflare:1.47.2
    restart: unless-stopped
  auth:
    container_name: qarar-supabase-auth
    depends_on:
      db:
        condition: service_healthy
        required: true
      db-migrate:
        condition: service_completed_successfully
        required: true
      mail:
        condition: service_started
        required: true
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9999/health
      timeout: 5s
    image: public.ecr.aws/supabase/gotrue:v2.192.0
    restart: unless-stopped
  db:
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    container_name: qarar-supabase-db
    environment:
      JWT_EXP: ${JWT_EXPIRY}
      JWT_SECRET: ${JWT_SECRET}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -h
        - localhost
      timeout: 5s
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    ports:
      - ${QARAR_DB_DIRECT_PORT:-54327}:5432
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/data
        target: /var/lib/postgresql/data
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./volumes/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        type: bind
      - source: db-config
        target: /etc/postgresql-custom
        type: volume
        volume: {}
  db-migrate:
    command:
      - sh
      - /scripts/apply-migrations.sh
    container_name: qarar-supabase-migrations
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: supabase_admin
    image: public.ecr.aws/docker/library/postgres:17-alpine
    restart: "no"
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ../migrations
        target: /migrations
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../seed.sql
        target: /seed/seed.sql
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./qarar/apply-migrations.sh
        target: /scripts/apply-migrations.sh
        type: bind
  functions:
    command:
      - start
      - --main-service
      - /home/deno/functions/main
    container_name: qarar-supabase-functions
    depends_on:
      db-migrate:
        condition: service_completed_successfully
        required: true
      kong:
        condition: service_healthy
        required: true
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SMTP_FROM: ${SMTP_SENDER_NAME} <${SMTP_ADMIN_EMAIL}>
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEYS: '{"default":"${SUPABASE_PUBLISHABLE_KEY:-}"}'
      SUPABASE_SECRET_KEYS: '{"default":"${SUPABASE_SECRET_KEY:-}"}'
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_URL: http://kong:8000
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'
      timeout: 5s
    image: public.ecr.aws/supabase/edge-runtime:v1.74.2
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ../functions
        target: /home/deno/functions
        type: bind
      - source: deno-cache
        target: /root/.cache/deno
        type: volume
        volume: {}
  imgproxy:
    container_name: qarar-supabase-imgproxy
    environment:
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_BIND: :5001
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
      IMGPROXY_USE_ETAG: "true"
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD
        - imgproxy
        - health
      timeout: 5s
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        source: ./volumes/storage
        target: /var/lib/storage
        type: bind
  kong:
    container_name: qarar-supabase-kong
    depends_on:
      db-migrate:
        condition: service_completed_successfully
        required: true
      studio:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - /home/kong/kong-entrypoint.sh
    environment:
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      KONG_ROUTER_FLAVOR: expressions
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    healthcheck:
      interval: 5s
      retries: 5
      test:
        - CMD
        - kong
        - health
      timeout: 5s
    image: kong/kong:3.9.1
    networks:
      default:
        aliases:
          - api-gw
    ports:
      - ${KONG_HTTP_PORT}:8000/tcp
      - ${KONG_HTTPS_PORT}:8443/tcp
      - ${QARAR_API_PORT:-54321}:8000
      - ${QARAR_API_HTTPS_PORT:-54326}:8443
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./volumes/api/kong.yml
        target: /home/kong/temp.yml
        type: bind
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./volumes/api/kong-entrypoint.sh
        target: /home/kong/kong-entrypoint.sh
        type: bind
  mail:
    container_name: qarar-supabase-mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - /mailpit
        - readyz
      timeout: 5s
    image: axllent/mailpit:v1.27
    ports:
      - ${QARAR_MAIL_UI_PORT:-8025}:8025
      - ${QARAR_SMTP_PORT:-1025}:1025
    restart: unless-stopped
  meta:
    container_name: qarar-supabase-meta
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_USER: postgres
      PG_META_PORT: 8080
    image: public.ecr.aws/supabase/postgres-meta:v0.96.6
    restart: unless-stopped
  realtime:
    container_name: qarar-supabase-realtime
    depends_on:
      db:
        condition: service_healthy
        required: true
      db-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      API_JWT_SECRET: ${JWT_SECRET}
      APP_NAME: realtime
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DISABLE_HEALTHCHECK_LOGGING: "true"
      DNS_NODES: ''''''
      ERL_AFLAGS: -proto_dist inet_tcp
      METRICS_JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      RLIMIT_NOFILE: "10000"
      RUN_JANITOR: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SEED_SELF_HOST: "true"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
        - CMD-SHELL
        - 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}" http://localhost:4000/api/tenants/realtime-dev/health'
      timeout: 5s
    image: public.ecr.aws/supabase/realtime:v2.112.6
    restart: unless-stopped
  rest:
    command:
      - postgrest
    container_name: qarar-supabase-rest
    depends_on:
      db:
        condition: service_healthy
        required: true
      db-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD
        - postgrest
        - --ready
      timeout: 5s
    image: public.ecr.aws/supabase/postgrest:v14.14
    restart: unless-stopped
  storage:
    container_name: qarar-supabase-storage
    depends_on:
      db:
        condition: service_healthy
        required: true
      db-migrate:
        condition: service_completed_successfully
        required: true
      imgproxy:
        condition: service_started
        required: true
      rest:
        condition: service_started
        required: true
    environment:
      ANON_KEY: ${ANON_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      FILE_SIZE_LIMIT: 52428800
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      IMGPROXY_URL: http://imgproxy:5001
      POSTGREST_URL: http://rest:3000
      REGION: ${REGION}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      STORAGE_BACKEND: file
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      TENANT_ID: ${STORAGE_TENANT_ID}
    healthcheck:
      interval: 5s
      retries: 3
      start_period: 10s
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://storage:5000/status
      timeout: 5s
    image: public.ecr.aws/supabase/storage-api:v1.62.5
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        source: ./volumes/storage
        target: /var/lib/storage
        type: bind
  studio:
    container_name: qarar-supabase-studio
    depends_on:
      analytics:
        condition: service_healthy
        required: true
      db-migrate:
        condition: service_completed_successfully
        required: true
    environment:
      - AUTH_JWT_SECRET=${JWT_SECRET}
      - DEFAULT_ORGANIZATION_NAME=${STUDIO_DEFAULT_ORGANIZATION}
      - DEFAULT_PROJECT_NAME=${STUDIO_DEFAULT_PROJECT}
      - EDGE_FUNCTIONS_MANAGEMENT_FOLDER=/app/edge-functions
      - ENABLED_FEATURES_LOGS_ALL=true
      - HOSTNAME=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      - PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS:-1000}
      - PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS}
      - PG_META_CRYPTO_KEY=${PG_META_CRYPTO_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER_READ_WRITE=postgres
      - SNIPPETS_MANAGEMENT_FOLDER=/app/snippets
      - STUDIO_PG_META_URL=http://meta:8080
      - SUPABASE_ANON_KEY=${ANON_KEY}
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_URL=http://kong:8000
      - LOGFLARE_PRIVATE_ACCESS_TOKEN=${LOGFLARE_PRIVATE_ACCESS_TOKEN}
      - LOGFLARE_URL=http://analytics:4000
    healthcheck:
      interval: 5s
      retries: 3
      start_period: 20s
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
    image: supabase/studio:2026.07.07-sha-a6a04f2
    ports:
      - ${QARAR_STUDIO_PORT:-54323}:3000
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        source: ./volumes/snippets
        target: /app/snippets
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ../functions
        target: /app/edge-functions
        type: bind
  supavisor:
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    container_name: qarar-supabase-pooler
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      API_JWT_SECRET: ${JWT_SECRET}
      CLUSTER_POSTGRES: "true"
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
      ERL_AFLAGS: -proto_dist inet_tcp
      METRICS_JWT_SECRET: ${JWT_SECRET}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      PORT: 4000
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REGION: local
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - curl
        - -sSfL
        - --head
        - -o
        - /dev/null
        - http://127.0.0.1:4000/api/health
      timeout: 5s
    image: public.ecr.aws/supabase/supavisor:2.9.5
    ports:
      - ${QARAR_DB_PORT:-54322}:5432
      - ${QARAR_POOLER_PORT:-54329}:6543
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./volumes/pooler/pooler.exs
        target: /etc/pooler/pooler.exs
        type: bind
  vector:
    command:
      - --config
      - /etc/vector/vector.yml
    container_name: qarar-supabase-vector
    depends_on:
      analytics:
        condition: service_healthy
        required: true
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: ${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://vector:9001/health
      timeout: 5s
    image: timberio/vector:0.53.0-alpine
    restart: unless-stopped
    security_opt:
      - label=disable
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./volumes/logs/vector.yml
        target: /etc/vector/vector.yml
        type: bind
      - bind:
          selinux: z
        read_only: true
        source: ${DOCKER_SOCKET_LOCATION}
        target: /var/run/docker.sock
        type: bind
volumes:
  db-config: null
  deno-cache: null
