name: qarar-dashboard-dev

services:
  dashboard-dev:
    image: node:22-alpine
    container_name: qarar-dashboard-dev
    working_dir: /workspace/apps/dashboard
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      APP_ORIGIN: https://devqarar.prideidea.com
      QARAR_ALLOWED_DEV_ORIGINS: devqarar.prideidea.com
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      PORT: 3000
      QARAR_SUPABASE_ANON_KEY: ${ANON_KEY}
      QARAR_SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      QARAR_SUPABASE_URL: http://qarar-dev-supabase-kong:8000
      QARAR_ACTIVATION_TOKEN_SECRET: ${QARAR_ACTIVATION_TOKEN_SECRET:-${SERVICE_ROLE_KEY}}
      QARAR_LOGIN_RATE_LIMIT_CLIENT_IP_HEADER: x-qarar-client-ip
      QARAR_LOGIN_RATE_LIMIT_HMAC_SECRET: ${QARAR_LOGIN_RATE_LIMIT_HMAC_SECRET}
      QARAR_LOGIN_RATE_LIMIT_REDIS_HOST: qarar-dev-login-rate-limit-redis
      QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD: ${QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD}
      QARAR_LOGIN_RATE_LIMIT_REDIS_PORT: 6379
      GOVERNANCE_V2_UI_ENABLED: "true"
      OPENWA_ADMIN_BASE_URL: http://qarar-openwa-test:2785
      OPENWA_API_KEY_FILE: /run/openwa-data/.api-key
      OPENWA_SESSION_NAME: qarar-test
      WATCHPACK_POLLING: "true"
    networks:
      - fateen_net
      - qarar_dev
      - openwa_test
    restart: unless-stopped
    volumes:
      - .:/workspace
      - dashboard-dev-next:/workspace/apps/dashboard/.next
      - openwa_test_data:/run/openwa-data:ro

  notification-worker-dev:
    image: node:22-alpine
    container_name: qarar-notification-worker-dev
    working_dir: /workspace/services/notification-worker
    command: npm start
    environment:
      QARAR_SUPABASE_URL: http://qarar-dev-supabase-kong:8000
      QARAR_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      OPENWA_BASE_URL: http://qarar-openwa-test:2785
      OPENWA_SESSION_ID: qarar-test
      OPENWA_API_KEY_FILE: /run/openwa-data/.api-key
      NOTIFICATION_WORKER_INTERVAL_MS: 5000
      NOTIFICATION_WORKER_BATCH_SIZE: 25
    networks:
      - qarar_dev
      - openwa_test
    restart: unless-stopped
    volumes:
      - .:/workspace:ro
      - openwa_test_data:/run/openwa-data:ro

networks:
  fateen_net:
    external: true
  qarar_dev:
    external: true
    name: qarar-dev_default
  openwa_test:
    external: true
    name: qarar-openwa-test-network

volumes:
  dashboard-dev-next:
  openwa_test_data:
    external: true
    name: qarar-openwa-test-data
