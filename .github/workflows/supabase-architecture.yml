name: Supabase Architecture

on:
  pull_request:
    branches: [dev]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-architecture.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [dev]

concurrency:
  group: supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure local stack
        run: cp supabase/docker/.env.example supabase/docker/.env
      - name: Rehearse existing-data upgrade and failure rollback
        run: sh supabase/tests/migration-upgrade-rehearsal.sh
      - name: Database logs
        if: failure()
        run: docker logs qarar-supabase-db --tail 300

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure and start Supabase
        run: |
          cp supabase/docker/.env.example supabase/docker/.env
          npm run docker:config
          npm run docker:start
      - name: Wait for API health
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:54321/auth/v1/health >/dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Database contracts and security boundaries
        run: sh supabase/tests/run-completed-db-tests.sh
      - name: Edge handler
        run: npm run test:iam-edge
      - name: Compatibility dependency allowlist
        run: npm run test:compatibility
      - name: IAM HTTP
        run: npm run test:iam-http
      - name: Sprint 01 HTTP
        run: npm run test:sprint01-http
      - name: Sprint 03 HTTP
        run: npm run test:sprint03-http
      - name: Compose status and logs
        if: failure()
        run: |
          npm run docker:status
          docker compose --env-file supabase/docker/.env \
            -f supabase/docker/docker-compose.yml logs --tail 300
