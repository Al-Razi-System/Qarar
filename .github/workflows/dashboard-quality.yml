name: Dashboard Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - "apps/dashboard/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/docker/**"
      - "scripts/*e2e*"
      - ".github/workflows/dashboard-quality.yml"
  push:
    # Dedicated validation branches can exercise the complete gate before a
    # merge, without API credentials or changing the shared working branch.
    branches: [dev, "codex/ci-*"]

concurrency:
  group: dashboard-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Verify documentation encoding
        working-directory: ${{ github.workspace }}
        run: npm run test:development-governance
      - name: Verify E2E isolation safeguards
        working-directory: ${{ github.workspace }}
        run: node --test scripts/isolated-e2e-ci.test.mjs

  api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:compatibility
      - run: npm run test:docs-encoding

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fresh Docker configuration
        # The pgTAP files build their own fixtures. The development seed cannot
        # run on a fresh volume yet: it executes functions that read
        # auth.sessions, which GoTrue creates only after the migration runner.
        run: |
          cp supabase/docker/.env.example supabase/docker/.env
          sed -i 's/^QARAR_APPLY_SEED=.*/QARAR_APPLY_SEED=false/' supabase/docker/.env
      - name: Validate and start the stack
        run: |
          npm run docker:config
          sh scripts/pull-supabase-compose-images.sh
          docker compose --env-file supabase/docker/.env \
            -f supabase/docker/docker-compose.yml up -d --wait --pull never
      - name: Run database contract smoke tests
        run: sh supabase/tests/run-completed-db-tests.sh
      - name: Race a decision edit against minutes submission in two sessions
        if: ${{ !cancelled() }}
        run: |
          PGHOST=127.0.0.1 \
          PGPORT="$(sed -n 's/^QARAR_DB_DIRECT_PORT=//p' supabase/docker/.env)" \
          PGUSER=supabase_admin \
          PGPASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' supabase/docker/.env)" \
          PGDATABASE=postgres \
          bash supabase/tests/concurrency/decision_minutes_lock.sh
      - name: Verify generated API contract reference against the running registry
        run: npm run test:api-docs
      - if: always()
        run: docker compose --env-file supabase/docker/.env -f supabase/docker/docker-compose.yml logs --tail 200
      - if: always()
        run: docker compose --env-file supabase/docker/.env -f supabase/docker/docker-compose.yml down -v

  regulations-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [quality, api-contracts, docker-smoke]
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare Supabase configuration
        working-directory: ${{ github.workspace }}
        run: sh scripts/prepare-e2e-supabase-env.sh
      - name: Validate isolated Supabase configuration
        working-directory: ${{ github.workspace }}
        run: node scripts/e2e-supabase.mjs config
      - name: Pull isolated Supabase images
        working-directory: ${{ github.workspace }}
        run: node scripts/e2e-supabase.mjs pull
      - name: Start isolated Supabase
        working-directory: ${{ github.workspace }}
        run: node scripts/e2e-supabase.mjs up
      - name: Verify JWT database initialization
        working-directory: ${{ github.workspace }}
        run: node scripts/test-e2e-jwt-database.mjs
      - name: Seed isolated Supabase after Auth is ready
        working-directory: ${{ github.workspace }}
        run: |
          # The browser fixture copies the permission catalogue of the seeded
          # demo organization. Re-run the migration runner with the seed on: it
          # verifies the applied migrations and records the seed in its ledger.
          node scripts/e2e-supabase.mjs seed
      - name: Run regulations browser scenarios
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulations-playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Print service logs on failure
        if: ${{ failure() && env.QARAR_E2E_ENV_FILE != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/e2e-supabase.mjs logs
      - name: Stop Supabase
        if: ${{ always() && env.QARAR_E2E_ENV_FILE != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/e2e-supabase.mjs down
