global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: qarar-dashboard
    metrics_path: /api/metrics
    params:
      format: [prometheus]
    authorization:
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ["dashboard:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: qarar-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://dashboard:3000/api/health
          - http://kong:8000/auth/v1/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
