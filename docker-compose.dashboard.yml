services:
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: qarar-dashboard
    environment:
      APP_ORIGIN: https://qarar.prideidea.com
      APP_ORIGIN_ALIASES: https://qrar.prideidea.com
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      QARAR_SUPABASE_ANON_KEY: ${ANON_KEY}
      QARAR_SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      QARAR_SUPABASE_URL: http://qarar-supabase-kong:8000
      QARAR_ACTIVATION_TOKEN_SECRET: ${QARAR_ACTIVATION_TOKEN_SECRET:-${SERVICE_ROLE_KEY}}
      QARAR_LOGIN_RATE_LIMIT_CLIENT_IP_HEADER: x-qarar-client-ip
      QARAR_LOGIN_RATE_LIMIT_HMAC_SECRET: ${QARAR_LOGIN_RATE_LIMIT_HMAC_SECRET}
      QARAR_LOGIN_RATE_LIMIT_REDIS_HOST: qarar-login-rate-limit-redis
      QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD: ${QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD}
      QARAR_LOGIN_RATE_LIMIT_REDIS_PORT: 6379
      QARAR_UPLOAD_SCAN_ADAPTER: clamav-internal
      QARAR_UPLOAD_SCAN_HOST: clamav
      QARAR_UPLOAD_SCAN_MAX_BYTES: 26214400
      QARAR_UPLOAD_SCAN_PORT: 3310
      QARAR_UPLOAD_SCAN_REQUIRED: "true"
      QARAR_UPLOAD_SCAN_TIMEOUT_MS: 30000
    networks:
      - fateen_net
      - qarar_upload_scanner
      - supabase_default
    restart: unless-stopped
    depends_on:
      dashboard-login-rate-limit-redis:
        condition: service_healthy

  dashboard-login-rate-limit-redis:
    image: redis:7-alpine
    container_name: qarar-login-rate-limit-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD: ${QARAR_LOGIN_RATE_LIMIT_REDIS_PASSWORD}
    networks:
      fateen_net:
      supabase_default:
    restart: unless-stopped
    volumes:
      - login-rate-limit-data:/data

networks:
  fateen_net:
    external: true
  qarar_upload_scanner:
    external: true
    name: qarar-upload-scanner
  supabase_default:
    external: true

volumes:
  login-rate-limit-data:
